<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center py-5">
  <div class="container" style="max-width: 440px;">
    <div class="text-center mb-4">
      <h1 class="brand-gradient display-5 fw-bold mb-1"><i class="bi bi-layers-fill me-2"></i>Task Manager</h1>
      <p class="text-muted">Sign in to your organization workspace</p>
    </div>

    <div class="card card-custom p-4 p-md-5">
      <h3 class="fw-bold mb-4">Login</h3>

      <form id="login-form">
        <div class="mb-3">
          <label for="email" class="form-label text-muted small fw-semibold">EMAIL ADDRESS</label>
          <input type="email" class="form-control form-control-custom" id="email" required placeholder="name@organization.com">
        </div>

        <div class="mb-4">
          <label for="password" class="form-label text-muted small fw-semibold">PASSWORD</label>
          <input type="password" class="form-control form-control-custom" id="password" required placeholder="Enter password">
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mb-3" id="login-btn">
          <span id="btn-text"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
          <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>

        <div class="text-center text-muted small">
          Don't have an account? <a href="register.html" class="text-info text-decoration-none fw-semibold">Register here</a>
        </div>
      </form>
    </div>
  </div>

  <div id="alert-container"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
