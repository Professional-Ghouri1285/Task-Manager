<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center py-5">
  <div class="container" style="max-width: 480px;">
    <div class="text-center mb-4">
      <h1 class="brand-gradient display-5 fw-bold mb-1"><i class="bi bi-layers-fill me-2"></i>Task Manager</h1>
      <p class="text-muted">Create your multi-tenant account</p>
    </div>

    <div class="card card-custom p-4 p-md-5">
      <h3 class="fw-bold mb-4">Register</h3>

      <form id="register-form">
        <div class="mb-3">
          <label for="name" class="form-label text-muted small fw-semibold">FULL NAME</label>
          <input type="text" class="form-control form-control-custom" id="name" required placeholder="Jane Doe">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label text-muted small fw-semibold">EMAIL ADDRESS</label>
          <input type="email" class="form-control form-control-custom" id="email" required placeholder="jane@organization.com">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label text-muted small fw-semibold">PASSWORD</label>
          <input type="password" class="form-control form-control-custom" id="password" required minlength="6" placeholder="At least 6 characters">
        </div>

        <div class="mb-3">
          <label for="organizationId" class="form-label text-muted small fw-semibold">ORGANIZATION ID (GUID)</label>
          <input type="text" class="form-control form-control-custom" id="organizationId" required value="11111111-1111-1111-1111-111111111111" placeholder="e.g. 11111111-1111-1111-1111-111111111111">
          <div class="form-text text-muted small">Pre-filled with default org (Acme Corp).</div>
        </div>

        <div class="mb-4">
          <label for="jobTitle" class="form-label text-muted small fw-semibold">JOB TITLE (OPTIONAL)</label>
          <input type="text" class="form-control form-control-custom" id="jobTitle" placeholder="e.g. Senior Software Engineer">
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mb-3" id="register-btn">
          <span id="btn-text"><i class="bi bi-person-plus-fill me-2"></i>Create Account</span>
          <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>

        <div class="text-center text-muted small">
          Already have an account? <a href="login.html" class="text-info text-decoration-none fw-semibold">Log in here</a>
        </div>
      </form>
    </div>
  </div>

  <div id="alert-container"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
